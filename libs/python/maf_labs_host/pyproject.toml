[project]
name = "maf-labs-host"
version = "0.1.0"
description = "Shared hosting and infrastructure for maf-experimentation-labs projects"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core>=1.21",
    "agent-framework-openai>=1.16",
    "agent-framework-declarative>=1.2",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
foundry = ["agent-framework-foundry", "azure-identity"]
azure = ["azure-identity"]
devui = ["agent-framework-devui"]

[project.scripts]
maf-host = "maf_labs_host.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maf_labs_host"]
