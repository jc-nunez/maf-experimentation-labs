# SearXNG web-search backend for the web tools (tools/python/web-search), run locally with Docker.
# Managed by `mafx infra up|down|status searxng`; set SEARXNG_URL=http://127.0.0.1:8888 in .env.
name: maf-searxng

services:
  searxng:
    # Pinned by digest (multi-arch, arm64 verified).
    image: searxng/searxng@sha256:5903efa50bc6b99293fa059f7a0ff37eddd910210196af77d02e5536ccdfb387
    container_name: maf-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"   # loopback only: no authentication, not for the network
    env_file:
      - .env                    # SEARXNG_SECRET, generated by `mafx infra up` (gitignored)
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 1g
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
