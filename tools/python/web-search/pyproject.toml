[project]
name = "web-search"
version = "0.1.0"
description = "Shared tools: web_search (SearXNG) and fetch_url (page -> markdown)"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core>=1.21",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "ddgs>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_search"]
