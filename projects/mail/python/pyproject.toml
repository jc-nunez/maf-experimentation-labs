[project]
name = "mail"
version = "0.1.0"
description = "Mail organizer: triage outlook.com mail (read-only), bet 001"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "maf-labs-host",
    "msal>=1.31",
]

[project.scripts]
mail-agent = "mail_agent.__main__:main"

[tool.uv.sources]
maf-labs-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_agent"]
