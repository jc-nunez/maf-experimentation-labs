[project]
name = "harness-lab"
version = "0.1.0"
description = "Harness agents (create_harness_agent / HarnessAgent): planning, todos, modes, file memory"
requires-python = ">=3.10"
dependencies = ["maf-labs-host"]

[project.scripts]
harness-lab = "harness_lab.__main__:main"

[tool.uv.sources]
maf-labs-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_lab"]
