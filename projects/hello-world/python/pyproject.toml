[project]
name = "hello-world"
version = "0.1.0"
description = "hello-world project: agents, tools and workflows"
requires-python = ">=3.10"
dependencies = ["maf-labs-host"]

[project.scripts]
hello-world = "hello_world.__main__:main"

[tool.uv.sources]
maf-labs-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_world"]
